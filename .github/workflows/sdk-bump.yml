# New SDK releases open PRs.
#
# browser-sdk: a new browser SDK in production. A new @payfurl/client on npm is the signal: only the platform's
# master `deploy sdk` publishes it, while sandbox uploads /vX.Y.Z/ to the asset bucket earlier, so an asset URL
# existing is not one. The PR bumps PAYFURL_SDK_URL (whose version /info/providers is also told) and the patch
# version and adds a changelog entry (CHANGELOG.md and readme.txt).
#
# php-sdk: a new payfurl/phpsdk on Packagist (repo.packagist.org/p2, no token). The plugin ships the SDK in its zip,
# so a store gets an SDK release only with a plugin release: a minor or patch PR raises the constraint's minimum,
# updates composer.lock, bumps the patch version and adds the changelog entries. A new major is not compatible: its
# PR is a draft that only changes the constraint and the lock, to start the migration from.
#
# A version is skipped once a PR for its branch exists (open, merged or closed). A run that pushed the branch but
# failed to open the PR is retried the next night: the branch is force-pushed again from main.
#
# A minor or patch PR merges itself once CI passes (gh pr merge --auto), and release.yml then releases the new version
# from main. That needs a ruleset requiring status checks on main (without one the PR is left to a person) and the
# SDK_BUMP_TOKEN secret, a fine-grained token with contents and pull-requests write on this repository: GitHub runs
# no CI on a PR opened with the default token, and starts no release.yml for a merge made with it. The e2e suite in
# payfurl/platform is not part of CI: its store loads the browser SDK built from source, not the pinned release.
name: SDK bump

on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  browser-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.SDK_BUMP_TOKEN || github.token }}

      - name: Compare the pinned SDK with npm
        id: sdk
        env:
          GH_TOKEN: ${{ secrets.SDK_BUMP_TOKEN || github.token }}
        run: |
          latest=$(npm view @payfurl/client version)
          if ! [[ "$latest" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::unexpected npm version '$latest'"
            exit 1
          fi
          pinned=$(sed -nE 's#.*assets\.payfurl\.com/v([0-9.]+)/js/payfurl\.js.*#\1#p' woocommerce-payfurl.php)
          echo "pinned v$pinned, npm v$latest"
          branch="sdk-bump/v$latest"
          prs=$(gh pr list --head "$branch" --state all --json number --jq length)
          if [ "$latest" = "$pinned" ] || [ "$prs" != 0 ]; then
            echo "nothing to do"
            exit 0
          fi
          curl -fsSI "https://assets.payfurl.com/v$latest/js/payfurl.js" >/dev/null
          { echo "latest=$latest"; echo "pinned=$pinned"; echo "branch=$branch"; } >> "$GITHUB_OUTPUT"

      - name: Open the PR
        if: steps.sdk.outputs.latest
        env:
          GH_TOKEN: ${{ secrets.SDK_BUMP_TOKEN || github.token }}
          LATEST: ${{ steps.sdk.outputs.latest }}
          PINNED: ${{ steps.sdk.outputs.pinned }}
          BRANCH: ${{ steps.sdk.outputs.branch }}
        run: |
          sed -i "s#assets.payfurl.com/v$PINNED/js/payfurl.js#assets.payfurl.com/v$LATEST/js/payfurl.js#" woocommerce-payfurl.php
          current=$(jq -r .version package.json)
          next=$(echo "$current" | awk -F. '{ printf "%d.%d.%d", $1, $2, $3 + 1 }')
          today=$(date -u +%F)
          sed -i -E "s/^( \* Version: +)$current$/\1$next/; s/^define\( 'PAYFURL_VERSION', '$current' \);$/define( 'PAYFURL_VERSION', '$next' );/" woocommerce-payfurl.php
          sed -i "s/^Stable tag: $current$/Stable tag: $next/" readme.txt
          jq --tab --arg v "$next" '.version = $v' package.json > package.tmp && mv package.tmp package.json
          npm install --package-lock-only --no-audit --no-fund >/dev/null

          # A new section under "## [Unreleased]", and its compare link.
          entry="## [$next] - $today\n\n### Changed\n\n- Browser SDK updated from v$PINNED to v$LATEST\n  ([SDK changelog](https://docs.payfurl.com/client_sdk/changelog)).\n"
          awk -v entry="$entry" '{ print } /^## \[Unreleased\]/ { printf "\n%s", entry }' CHANGELOG.md > CHANGELOG.tmp
          sed -i -E "s#^\[Unreleased\]: (.*)/compare/v[0-9.]+\.\.\.HEAD#[Unreleased]: \1/compare/v$next...HEAD\n[$next]: \1/compare/v$current...v$next#" CHANGELOG.tmp
          mv CHANGELOG.tmp CHANGELOG.md
          # And readme.txt's, which WordPress.org shows.
          awk -v entry="= $next - $today =\n\n* Browser SDK updated from v$PINNED to v$LATEST.\n" '{ print } /^== Changelog ==/ { printf "\n%s", entry }' readme.txt > readme.tmp
          mv readme.tmp readme.txt

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$BRANCH"
          git commit -am "Browser SDK v$LATEST (plugin $next)"
          git push --force origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" --title "Browser SDK v$LATEST (plugin $next)" --body \
            "Pins the browser SDK released to production as @payfurl/client v$LATEST ([changelog](https://docs.payfurl.com/client_sdk/changelog)) and bumps the plugin to $next.

          It merges itself once CI passes, and the merge releases v$next to WordPress.org (release.yml)."

      - name: Merge it once CI passes
        if: steps.sdk.outputs.latest
        env:
          GH_TOKEN: ${{ secrets.SDK_BUMP_TOKEN || github.token }}
          BRANCH: ${{ steps.sdk.outputs.branch }}
        run: |
          # Without required checks, --auto would merge at once: leave the PR to a person.
          checks=$(gh api "repos/$GITHUB_REPOSITORY/rules/branches/main" --jq '[.[] | select(.type == "required_status_checks")] | length')
          if [ "$checks" = 0 ]; then
            echo "::warning::main requires no checks: merge the PR by hand"
            exit 0
          fi
          gh pr merge "$BRANCH" --auto --merge

  php-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.SDK_BUMP_TOKEN || github.token }}

      - name: Compare the required SDK with Packagist
        id: sdk
        env:
          GH_TOKEN: ${{ secrets.SDK_BUMP_TOKEN || github.token }}
        run: |
          latest=$(curl -fsS https://repo.packagist.org/p2/payfurl/phpsdk.json \
            | jq -r '.packages["payfurl/phpsdk"][].version' | sed 's/^v//' \
            | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          if [ -z "$latest" ]; then
            echo "::error::no payfurl/phpsdk release on Packagist"
            exit 1
          fi
          constraint=$(jq -r '.require["payfurl/phpsdk"]' composer.json)
          if ! [[ "$constraint" =~ ^\^([0-9]+)(\.[0-9]+)?(\.[0-9]+)?$ ]]; then
            echo "::error::composer.json requires payfurl/phpsdk '$constraint', not ^X.Y.Z: bump it by hand"
            exit 1
          fi
          major=${BASH_REMATCH[1]}
          required="$major${BASH_REMATCH[2]:-.0}${BASH_REMATCH[3]:-.0}"
          echo "required $required ($constraint), Packagist $latest"
          branch="phpsdk-bump/v$latest"
          prs=$(gh pr list --head "$branch" --state all --json number --jq length)
          if [ "$(printf '%s\n' "$required" "$latest" | sort -V | tail -1)" = "$required" ] \
            || [ "$prs" != 0 ]; then
            echo "nothing to do"
            exit 0
          fi
          { echo "latest=$latest"; echo "required=$required"; echo "branch=$branch"
            echo "major=$([ "${latest%%.*}" != "$major" ] && echo true || echo false)"; } >> "$GITHUB_OUTPUT"

      - uses: shivammathur/setup-php@v2
        if: steps.sdk.outputs.latest
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: none

      - name: Open the PR
        if: steps.sdk.outputs.latest
        env:
          GH_TOKEN: ${{ secrets.SDK_BUMP_TOKEN || github.token }}
          LATEST: ${{ steps.sdk.outputs.latest }}
          REQUIRED: ${{ steps.sdk.outputs.required }}
          BRANCH: ${{ steps.sdk.outputs.branch }}
          MAJOR: ${{ steps.sdk.outputs.major }}
        run: |
          sed -i -E "s#(\"payfurl/phpsdk\": \")[^\"]+\"#\\1^$LATEST\"#" composer.json
          composer update payfurl/phpsdk --no-interaction --no-progress --no-install
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$BRANCH"
          sdk_changelog="https://github.com/payfurl/phpsdk/blob/v$LATEST/CHANGELOG.md"
          e2e="Before merging, run the e2e suite against this branch from a payfurl/platform checkout: \`just build\` here, then \`WOOCOMMERCE_PLUGIN_DIR=<this checkout> just e2e woocommerce\` there."

          if [ "$MAJOR" = true ]; then
            git commit -am "payfurl/phpsdk v$LATEST: a new major, to migrate to"
            git push --force origin "$BRANCH"
            gh pr create --draft --base main --head "$BRANCH" --title "payfurl/phpsdk v$LATEST (new major: needs a migration)" --body \
              "payfurl/phpsdk v$LATEST is a new major version ([changelog]($sdk_changelog), and the SDK's UPGRADE.md). This draft only changes the constraint from ^$REQUIRED to ^$LATEST and the lock: the plugin's SDK calls (includes/class-payfurl-sdk.php) need migrating by hand, with the plugin's version and changelog entries.

          $e2e"
            exit 0
          fi

          current=$(jq -r .version package.json)
          next=$(echo "$current" | awk -F. '{ printf "%d.%d.%d", $1, $2, $3 + 1 }')
          today=$(date -u +%F)
          sed -i -E "s/^( \* Version: +)$current$/\1$next/; s/^define\( 'PAYFURL_VERSION', '$current' \);$/define( 'PAYFURL_VERSION', '$next' );/" woocommerce-payfurl.php
          sed -i "s/^Stable tag: $current$/Stable tag: $next/" readme.txt
          jq --tab --arg v "$next" '.version = $v' package.json > package.tmp && mv package.tmp package.json
          npm install --package-lock-only --no-audit --no-fund >/dev/null
          entry="## [$next] - $today\n\n### Changed\n\n- payFURL PHP SDK updated from $REQUIRED to $LATEST\n  ([SDK changelog]($sdk_changelog)).\n"
          awk -v entry="$entry" '{ print } /^## \[Unreleased\]/ { printf "\n%s", entry }' CHANGELOG.md > CHANGELOG.tmp
          sed -i -E "s#^\[Unreleased\]: (.*)/compare/v[0-9.]+\.\.\.HEAD#[Unreleased]: \1/compare/v$next...HEAD\n[$next]: \1/compare/v$current...v$next#" CHANGELOG.tmp
          mv CHANGELOG.tmp CHANGELOG.md
          awk -v entry="= $next - $today =\n\n* payFURL PHP SDK updated from $REQUIRED to $LATEST.\n" '{ print } /^== Changelog ==/ { printf "\n%s", entry }' readme.txt > readme.tmp
          mv readme.tmp readme.txt

          git commit -am "payfurl/phpsdk v$LATEST (plugin $next)"
          git push --force origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" --title "payfurl/phpsdk v$LATEST (plugin $next)" --body \
            "Ships payfurl/phpsdk $LATEST ([changelog]($sdk_changelog)), the release now on Packagist, in place of $REQUIRED, and bumps the plugin to $next. The SDK is vendored in the plugin's zip, so stores get it with this release.

          It merges itself once CI passes, and the merge releases v$next to WordPress.org (release.yml). To check it first, turn off auto-merge on this PR. $e2e"

      - name: Merge it once CI passes
        if: steps.sdk.outputs.latest && steps.sdk.outputs.major == 'false'
        env:
          GH_TOKEN: ${{ secrets.SDK_BUMP_TOKEN || github.token }}
          BRANCH: ${{ steps.sdk.outputs.branch }}
        run: |
          # Without required checks, --auto would merge at once: leave the PR to a person.
          checks=$(gh api "repos/$GITHUB_REPOSITORY/rules/branches/main" --jq '[.[] | select(.type == "required_status_checks")] | length')
          if [ "$checks" = 0 ]; then
            echo "::warning::main requires no checks: merge the PR by hand"
            exit 0
          fi
          gh pr merge "$BRANCH" --auto --merge
